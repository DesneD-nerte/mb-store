version: '3.8'

services:
  # ===========================================
  # Frontend (Angular)
  # ===========================================
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/frontend/Dockerfile
    container_name: mb-frontend
    ports:
      - "4200:80"
    depends_on:
      - api-gateway
    networks:
      - mb-network
    restart: unless-stopped

  # ===========================================
  # API Gateway
  # ===========================================
  api-gateway:
    build:
      context: .
      dockerfile: apps/backend/api-gateway/Dockerfile
    container_name: mb-api-gateway
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - USER_SERVICE_URL=http://user-service:3001
      - PRODUCT_SERVICE_URL=http://product-service:3002
      - ORDER_SERVICE_URL=http://order-service:3003
      - PAYMENT_SERVICE_URL=http://payment-service:3004
      - NOTIFICATION_SERVICE_URL=http://notification-service:3005
    depends_on:
      - redis
      - user-service
      - product-service
      - order-service
      - payment-service
      - notification-service
    networks:
      - mb-network
    restart: unless-stopped

  # ===========================================
  # User Service + PostgreSQL
  # ===========================================
  user-service:
    build:
      context: .
      dockerfile: apps/backend/user-service/Dockerfile
    container_name: mb-user-service
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DATABASE_HOST=user-db
      - DATABASE_PORT=5432
      - DATABASE_NAME=user_db
      - DATABASE_USER=user_service
      - DATABASE_PASSWORD=user_service_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_URL=amqp://rabbitmq:5672
    depends_on:
      user-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - mb-network
    restart: unless-stopped

  user-db:
    image: postgres:16-alpine
    container_name: mb-user-db
    environment:
      - POSTGRES_DB=user_db
      - POSTGRES_USER=user_service
      - POSTGRES_PASSWORD=user_service_password
    volumes:
      - user-db-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - mb-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_service -d user_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ===========================================
  # Product Service + MongoDB
  # ===========================================
  product-service:
    build:
      context: .
      dockerfile: apps/backend/product-service/Dockerfile
    container_name: mb-product-service
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=development
      - PORT=3002
      - MONGODB_URI=mongodb://product_service:product_service_password@product-db:27017/product_db?authSource=admin
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_URL=amqp://rabbitmq:5672
    depends_on:
      product-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - mb-network
    restart: unless-stopped

  product-db:
    image: mongo:7
    container_name: mb-product-db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=product_service
      - MONGO_INITDB_ROOT_PASSWORD=product_service_password
      - MONGO_INITDB_DATABASE=product_db
    volumes:
      - product-db-data:/data/db
    ports:
      - "27017:27017"
    networks:
      - mb-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ===========================================
  # Order Service + PostgreSQL
  # ===========================================
  order-service:
    build:
      context: .
      dockerfile: apps/backend/order-service/Dockerfile
    container_name: mb-order-service
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=development
      - PORT=3003
      - DATABASE_HOST=order-db
      - DATABASE_PORT=5432
      - DATABASE_NAME=order_db
      - DATABASE_USER=order_service
      - DATABASE_PASSWORD=order_service_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_URL=amqp://rabbitmq:5672
    depends_on:
      order-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - mb-network
    restart: unless-stopped

  order-db:
    image: postgres:16-alpine
    container_name: mb-order-db
    environment:
      - POSTGRES_DB=order_db
      - POSTGRES_USER=order_service
      - POSTGRES_PASSWORD=order_service_password
    volumes:
      - order-db-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    networks:
      - mb-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_service -d order_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ===========================================
  # Payment Service + PostgreSQL
  # ===========================================
  payment-service:
    build:
      context: .
      dockerfile: apps/backend/payment-service/Dockerfile
    container_name: mb-payment-service
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=development
      - PORT=3004
      - DATABASE_HOST=payment-db
      - DATABASE_PORT=5432
      - DATABASE_NAME=payment_db
      - DATABASE_USER=payment_service
      - DATABASE_PASSWORD=payment_service_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_URL=amqp://rabbitmq:5672
    depends_on:
      payment-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - mb-network
    restart: unless-stopped

  payment-db:
    image: postgres:16-alpine
    container_name: mb-payment-db
    environment:
      - POSTGRES_DB=payment_db
      - POSTGRES_USER=payment_service
      - POSTGRES_PASSWORD=payment_service_password
    volumes:
      - payment-db-data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    networks:
      - mb-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_service -d payment_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ===========================================
  # Notification Service + PostgreSQL
  # ===========================================
  notification-service:
    build:
      context: .
      dockerfile: apps/backend/notification-service/Dockerfile
    container_name: mb-notification-service
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=development
      - PORT=3005
      - DATABASE_HOST=notification-db
      - DATABASE_PORT=5432
      - DATABASE_NAME=notification_db
      - DATABASE_USER=notification_service
      - DATABASE_PASSWORD=notification_service_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_URL=amqp://rabbitmq:5672
    depends_on:
      notification-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - mb-network
    restart: unless-stopped

  notification-db:
    image: postgres:16-alpine
    container_name: mb-notification-db
    environment:
      - POSTGRES_DB=notification_db
      - POSTGRES_USER=notification_service
      - POSTGRES_PASSWORD=notification_service_password
    volumes:
      - notification-db-data:/var/lib/postgresql/data
    ports:
      - "5436:5432"
    networks:
      - mb-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification_service -d notification_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ===========================================
  # Shared Infrastructure
  # ===========================================
  
  # Redis - Shared cache and session store
  redis:
    image: redis:7-alpine
    container_name: mb-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - mb-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # RabbitMQ - Message broker
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: mb-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=mb_store
      - RABBITMQ_DEFAULT_PASS=mb_store_password
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # Management UI
    networks:
      - mb-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

# ===========================================
# Networks
# ===========================================
networks:
  mb-network:
    driver: bridge
    name: mb-store-network

# ===========================================
# Volumes
# ===========================================
volumes:
  user-db-data:
    name: mb-user-db-data
  product-db-data:
    name: mb-product-db-data
  order-db-data:
    name: mb-order-db-data
  payment-db-data:
    name: mb-payment-db-data
  notification-db-data:
    name: mb-notification-db-data
  redis-data:
    name: mb-redis-data
  rabbitmq-data:
    name: mb-rabbitmq-data

